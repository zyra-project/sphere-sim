name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci

      # The boundary rule runs FIRST and fails the build on its own.
      # A/B isolation is not a lint warning to be triaged later: if the forward
      # model and the inverse model ever share geometry code, every score this
      # repo produces is circular. See packages/sim/README.md.
      - name: Boundary isolation (A/B share no math)
        run: npm run lint:boundary

      # The experiment pages report numbers that live in the results files, and
      # three separate times a page and its file disagreed -- once for a whole
      # commit history, because nothing compared them. The tables are generated
      # now, and this is the step that makes that mean something: a results file
      # that moves without its page moving is a red build.
      - name: Experiment pages match their results files
        run: npm run check:docs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # PARAMETERS.md 4.2 (multiplicity never exceeds 2) and 4.3 (the scalloped
      # unlit region) are both counterintuitive and both easy to break, and a
      # build that breaks them still renders something that looks like a sphere.
      # The check existed, passed, and ran in no workflow.
      - name: Reference geometry (PARAMETERS.md 4.2 and 4.3)
        run: npm run progress:reference:check

      # The browser bundles are typechecked separately from the Node one: they
      # target DOM and WebWorker libs, forbid the `node:` builtins, and emit real
      # JavaScript rather than only checking types. A page that typechecks under
      # tsconfig.json and fails under tsconfig.app.json is a page that imported
      # `node:zlib` through the sim barrel — which is exactly why neither browser
      # entry point ever imports a package's index.
      - name: Build the browser bundles
        run: |
          npm run build:web
          npm run build:app

      # Nothing above this line has ever compiled the GLSL. Every test in the
      # suite runs without a GPU, so a shader that fails to compile — or one
      # whose uniform block the linker drops — passes all of them and reaches
      # the user as a black rectangle. This drives headless Chromium over
      # swiftshader, serving the app itself, and needs the bundles above.
      #
      # It costs the runner a browser binary. That is the price of asking the
      # question at all: it cannot be answered in Node.
      - name: Smoke the app in a browser (the shader compiles, the workers reply)
        run: npm run smoke:app

      # TWELVE, not six. Six always covered archetypes 0-5 and never 6-11, so
      # `six-cameras`, `three-projectors`, `two-projectors`, `long-throw`,
      # `no-floor-reference` and `fov-held` were never judged — and the
      # unlit_in_mask waiver was scoped to two archetypes CI structurally could
      # not run, which the gate reported as an UNUSED waiver to be deleted.
      # Judging all twelve costs about four extra minutes across the two runs.
      #
      # The bench MEASURES. It does not judge, which is why both runs carry
      # --allow-failure: a failing gate must not stop the determinism check from
      # running, and a step that both measures and judges makes it ambiguous
      # which of the two went wrong when it goes red.
      - name: Headless bench (deterministic, seeded)
        run: npm run bench -- --scenarios 12 --seed 1234 --out bench-results.json --allow-failure

      - name: Determinism check (same seed, byte-identical output)
        run: |
          npm run bench -- --scenarios 12 --seed 1234 --out bench-results-2.json --allow-failure
          node tools/assert-deterministic.ts bench-results.json bench-results-2.json

      # The step above asks whether ONE tree agrees with itself. This asks
      # whether the tree still produces the numbers the repository recorded, and
      # nothing used to ask it.
      #
      # Every "the sphere path stays byte-identical" claim in
      # docs/ARBITRARY-SHAPES.md was checked by a person running the bench by
      # hand and comparing against a figure written in prose. That worked while
      # somebody remembered. A mesh change that reached a shared code path and
      # moved a sphere number would have gone green.
      #
      # No --allow-failure and no auto-update: a gate that repairs itself when it
      # fails is not a gate. Moving a number is legitimate and takes
      # `--update` plus a sentence in the commit message saying which moved.
      - name: Baseline check (the recorded numbers have not moved)
        run: npm run check:bench

      # ...and this step JUDGES. It is the only step allowed to fail on a
      # number, and it has no escape hatch on purpose.
      #
      # A gate fails the build unless gate-waivers.json covers it with a waiver
      # that is still in force: cites exactly one OPEN entry in
      # docs/AMENDMENTS.md, has not expired, and covers a failure no larger and
      # no wider than the one that entry accounts for. A waived gate is reported
      # as WAIVED with its citation, never as PASS, and the measured number goes
      # into bench-results.json unchanged. See packages/bench/src/waivers.ts.
      #
      # Before this step existed, cli.ts set `process.exitCode = 0` one line
      # after printing `VERDICT: FAIL`, so a build whose pose recovery missed §7
      # by 253x was green.
      - name: Gates (PARAMETERS.md §7, with waivers from gate-waivers.json)
        run: npm run gate -- bench-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench-results.json
            progress/
