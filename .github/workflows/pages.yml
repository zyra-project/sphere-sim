name: Pages

# Publishes the interactive simulator, the developer harness and — when the
# bench has produced one — the measurement record.
#
# ## Why the development branch is here alongside main
#
# There is exactly one live Pages URL, so publishing from a branch normally means
# somebody can read a number off a page that was published by an experiment. That
# is a real hazard and it is why this list is short and explicit rather than
# `branches: ['**']`.
#
# It does not apply yet. `main` is empty: every commit this project has is on the
# development branch below, and PR #1 is the project rather than a change to it.
# Until that merges there is nothing on main for a branch build to clobber, and
# the alternative — no way to look at the page before merging the commit that
# creates it — is worse.
#
# **Delete the second entry when PR #1 merges.** After that, a branch deploy is
# the hazard the first paragraph describes.
on:
  push:
    branches:
      - main
      - claude/sphere-sim-solver-fs3jg9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer commit waits rather than cancelling: the
# published site should be the newest COMPLETED build, not whichever race
# finished last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci

      # The boundary rule gates the deploy as well as the build. A site that
      # published a simulator scoring its own assumptions would be worse than no
      # site: it would look authoritative.
      - name: Boundary isolation (A/B share no math)
        run: npm run lint:boundary

      - name: Build the site
        run: npm run build:site

      # Does the shader actually compile? No headless test can answer that, and a
      # page whose canvas is black is the one failure a visitor cannot diagnose.
      # `ubuntu-latest` ships Chromium; the tool finds it or says which paths it
      # tried.
      - name: Smoke test the app in a real browser
        run: |
          npx --yes serve@14 -l 8174 site/app > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8174/ && break
            sleep 1
          done
          node tools/smoke-app.ts --url http://localhost:8174/
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The same bytes, downloadable, for the case where the deploy is blocked by
      # an environment rule or Pages is not enabled. Unzip it and serve it — the
      # page will not run from `file://`, because ES modules and module workers
      # both require an http origin.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
