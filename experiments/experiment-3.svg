<svg xmlns="http://www.w3.org/2000/svg" width="807" height="738" viewBox="0 0 807 738" role="img" aria-label="Photometric sensitivity ranking, stated ranges separated from inferred ranges">
<rect width="807" height="738" fill="#f9f9f7"/>
<text x="24" y="32" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Experiment 3 — which unmeasured constant actually moves a §7 metric?</text>
<text x="24" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">PROVISIONAL — every constant here is class ASSUME and none has been measured. A bar is how far a metric moves across the</text>
<text x="24" y="67" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">constant's plausible range, divided by that metric's own gate.</text>
<text x="24" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">A bar of 1.0 means the constant alone can move a §7 metric by the whole width of its gate. Longer than 1.0 means the constant</text>
<text x="24" y="97" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">decides the verdict on its own.</text>
<rect x="24" y="111" width="10" height="10" fill="#2a78d6"/>
<text x="40" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">the four §7 gates this project SCORES</text>
<rect x="292" y="111" width="10" height="10" fill="#eb6834"/>
<text x="308" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="400">readings §7 sets NO gate on (divergence, ambient-removed uplift)</text>
<text x="24" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Ranges PARAMETERS.md STATES  — rank on these</text>
<text x="24" y="139" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="400">The swing is a statement about the projector.</text>
