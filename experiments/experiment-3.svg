<text x="24" y="630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="400">§10 ranks gamma divergence the single highest photometric risk. On the four SCORED gates it ranks 8 of 20; on the unscored</text>
<text x="24" y="644" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="400">divergence reading it is first by an order of magnitude. What disagrees with §10 is the gates, not the physics.</text>
<text x="24" y="662" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="400">Bars are the largest swing over any single response, one constant moved at a time, everything else at its PARAMETERS.md nominal.</text>
<text x="24" y="676" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="400">No single constant swept alone crosses any §7 gate anywhere in its range.</text>
