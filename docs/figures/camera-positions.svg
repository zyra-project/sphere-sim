<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="Plan view of the room: sphere at centre, four projectors at ninety degree spacing, and three camera positions spread widely around the sphere rather than clustered.">
  <style>
    /* Higher-contrast per theme where the host allows CSS inside SVG. The
       presentation attributes on each element are the fallback where it does not
       — the figure degrades to a mid-tone palette legible on either ground,
       never to black-on-black. */
    .t { fill: #24292f; } .t-sm { fill: #57606a; }
    .s-faint { stroke: #57606a; } .f-faint { fill: #57606a; }
    .fill-surface { fill: #ffffff; fill-opacity: 1; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e6edf3; } .t-sm { fill: #8b949e; }
      .s-faint { stroke: #8b949e; } .f-faint { fill: #8b949e; }
      .fill-surface { fill: #0d1117; fill-opacity: 1; }
      .s-hi { stroke: #3ddbca; } .f-hi { fill: #3ddbca; } .t-hi { fill: #3ddbca; }
      .s-warn { stroke: #f0b429; } .f-warn { fill: #f0b429; } .t-warn { fill: #f0b429; }
    }
  </style>

            <defs>
              <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M0,1 L9,5 L0,9 z" class="f-faint" fill="#8b949e"/>
              </marker>
            </defs>

            <circle cx="200" cy="150" r="112" fill="none" class="s-faint" stroke="#8b949e" stroke-width="1" stroke-dasharray="2 5"/>
            <circle cx="200" cy="150" r="30" class="fill-surface" fill="#ffffff" fill-opacity="0.04" stroke="currentColor" stroke-width="2"/>
            <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="200" y="154" text-anchor="middle">sphere</text>

            <g class="s-faint" stroke="#8b949e">
              <line x1="322" y1="150" x2="234" y2="150" stroke-width="1.2" marker-end="url(#a3)"/>
              <line x1="200" y1="28" x2="200" y2="116" stroke-width="1.2" marker-end="url(#a3)"/>
              <line x1="78" y1="150" x2="166" y2="150" stroke-width="1.2" marker-end="url(#a3)"/>
              <line x1="200" y1="272" x2="200" y2="184" stroke-width="1.2" marker-end="url(#a3)"/>
            </g>
            <g class="f-faint" fill="#8b949e">
              <rect x="322" y="142" width="18" height="16" rx="2"/>
              <rect x="192" y="14" width="16" height="18" rx="2"/>
              <rect x="60" y="142" width="18" height="16" rx="2"/>
              <rect x="192" y="268" width="16" height="18" rx="2"/>
            </g>
            <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="348" y="154">P1</text>
            <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="214" y="14">P2</text>
            <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="34" y="154">P3</text>
            <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="214" y="292">P4</text>

            <g class="f-hi" fill="#1f9c8f">
              <circle cx="286" cy="72" r="8"/>
              <circle cx="104" cy="96" r="8"/>
              <circle cx="238" cy="252" r="8"/>
            </g>
            <text class="t-hi" font-size="12" font-weight="650" fill="#1f9c8f" font-family="ui-sans-serif, system-ui, sans-serif" x="300" y="64">A</text>
            <text class="t-hi" font-size="12" font-weight="650" fill="#1f9c8f" font-family="ui-sans-serif, system-ui, sans-serif" x="86" y="88">B</text>
            <text class="t-hi" font-size="12" font-weight="650" fill="#1f9c8f" font-family="ui-sans-serif, system-ui, sans-serif" x="252" y="264">C</text>

            <text class="t-hi" font-size="12" font-weight="650" fill="#1f9c8f" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="86">3 positions, spread wide</text>
            <text class="t" font-size="12" fill="#6e7781" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="110">1 → 2 positions:  418× better</text>
            <text class="t" font-size="12" fill="#6e7781" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="130">2 → 3 positions:  1.7× better</text>
            <text class="t" font-size="12" fill="#6e7781" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="150">3 → 8 positions:  nothing</text>
            <text class="t-warn" font-size="12" font-weight="650" fill="#bf8700" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="184">One position cannot</text>
            <text class="t-warn" font-size="12" font-weight="650" fill="#bf8700" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="202">solve it at all —</text>
            <text class="t" font-size="12" fill="#6e7781" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="220">distance and zoom</text>
            <text class="t" font-size="12" fill="#6e7781" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="238">look identical from</text>
            <text class="t" font-size="12" fill="#6e7781" font-family="ui-sans-serif, system-ui, sans-serif" x="404" y="256">a single viewpoint.</text>
          </svg>
