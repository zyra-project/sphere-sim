<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" role="img" aria-label="A seam between two projector footprints on the sphere, with the geometric meeting line and the crossfade centre drawn separately, and an intensity profile below showing that ramp width and ramp anchor are two different unknowns.">
  <style>
    /* Higher-contrast per theme where the host allows CSS inside SVG. The
       presentation attributes on each element are the fallback where it does not
       — the figure degrades to a mid-tone palette legible on either ground,
       never to black-on-black. */
    .t { fill: #24292f; } .t-sm { fill: #57606a; }
    .s-faint { stroke: #57606a; } .f-faint { fill: #57606a; }
    .fill-surface { fill: #ffffff; fill-opacity: 1; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e6edf3; } .t-sm { fill: #8b949e; }
      .s-faint { stroke: #8b949e; } .f-faint { fill: #8b949e; }
      .fill-surface { fill: #0d1117; fill-opacity: 1; }
      .s-hi { stroke: #3ddbca; } .f-hi { fill: #3ddbca; } .t-hi { fill: #3ddbca; }
      .s-warn { stroke: #f0b429; } .f-warn { fill: #f0b429; } .t-warn { fill: #f0b429; }
    }
  </style>

              <defs>
                <clipPath id="sph"><circle cx="196" cy="120" r="86"/></clipPath>
                <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M0,1 L9,5 L0,9 z" class="f-warn" fill="#bf8700"/>
                </marker>
              </defs>

              <rect x="18" y="26" width="356" height="188" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
              <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="26" y="18">camera frame · flat mid-gray, all projectors</text>

              <circle cx="196" cy="120" r="86" class="fill-surface" fill="#ffffff" fill-opacity="0.04" stroke="currentColor" stroke-width="2"/>
              <g clip-path="url(#sph)">
                <rect x="110" y="34" width="76" height="172" class="fill-sunk" fill="#8b949e" fill-opacity="0.14"/>
                <rect x="206" y="34" width="76" height="172" class="fill-sunk" fill="#8b949e" fill-opacity="0.14"/>
                <rect x="166" y="34" width="60" height="172" class="fill-accent-soft" fill="#1f9c8f" fill-opacity="0.15"/>
              </g>
              <circle cx="196" cy="120" r="86" fill="none" stroke="currentColor" stroke-width="2"/>

              <line x1="196" y1="34" x2="196" y2="206" class="s-faint" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
              <line x1="212" y1="34" x2="212" y2="206" class="s-warn" stroke="#bf8700" stroke-width="2"/>

              <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="120" y="126">P1 only</text>
              <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="248" y="126">P2 only</text>

              <line x1="196" y1="228" x2="212" y2="228" class="s-warn" stroke="#bf8700" stroke-width="1.6" marker-start="url(#a2)" marker-end="url(#a2)"/>
              <text class="t-warn" font-size="12" font-weight="650" fill="#bf8700" font-family="ui-sans-serif, system-ui, sans-serif" x="228" y="232">anchor — never stated</text>

              <!-- profile, aligned to the same x -->
              <text class="t-sm" font-size="10.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" x="18" y="262">brightness across the seam</text>
              <line x1="126" y1="310" x2="286" y2="310" class="s-faint" stroke="#8b949e" stroke-width="1.2"/>
              <polyline points="126,272 166,272 226,308 286,308" fill="none" class="s-faint" stroke="#8b949e" stroke-width="2"/>
              <polyline points="126,308 166,308 226,272 286,272" fill="none" class="s-faint" stroke="#8b949e" stroke-width="2"/>
              <line x1="166" y1="258" x2="166" y2="316" class="s-hi" stroke="#1f9c8f" stroke-width="1.5"/>
              <line x1="226" y1="258" x2="226" y2="316" class="s-hi" stroke="#1f9c8f" stroke-width="1.5"/>
              <text class="t-hi" font-size="12" font-weight="650" fill="#1f9c8f" font-family="ui-sans-serif, system-ui, sans-serif" x="196" y="252" text-anchor="middle">width</text>
              <line x1="212" y1="262" x2="212" y2="316" class="s-warn" stroke="#bf8700" stroke-width="2" stroke-dasharray="3 3"/>

              <text class="t" font-size="12" fill="#6e7781" font-family="ui-sans-serif, system-ui, sans-serif" x="316" y="272">Two unknowns, not one:</text>
              <text class="t-hi" font-size="12" font-weight="650" fill="#1f9c8f" font-family="ui-sans-serif, system-ui, sans-serif" x="316" y="292">how wide the ramp is</text>
              <text class="t-warn" font-size="12" font-weight="650" fill="#bf8700" font-family="ui-sans-serif, system-ui, sans-serif" x="316" y="310">and where it is centred</text>
            </svg>
