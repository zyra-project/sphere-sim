<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Science On a Sphere — installation simulator</title>
<!-- Inlined so the page makes exactly zero network requests beyond its own
     modules: a favicon 404 is the kind of console noise that trains a reader to
     ignore the console, which is where this page reports real failures. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%234da6ff'/%3E%3Cpath d='M5 16h22M16 5v22' stroke='%230a0a0e' stroke-width='1.6' opacity='.85'/%3E%3C/svg%3E"/>
<style>
/* One dark theme, deliberately. The subject is a projected image in a darkened
   gallery; a light mode would misrepresent what the renders mean. */
:root {
  --bg: #0a0a0e;
  --panel: rgba(13, 13, 18, 0.92);
  --stage: #07070a;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);
  --fg: #e8eaf0;
  --fg-2: #bbbbbb;
  --muted: #999999;
  --dim: #888888;
  --accent: #4da6ff;
  --good: #22c55e;
  --warn: #ffcc66;
  --bad: #ff6b6b;
  --assume: #d9a800;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; }
body {
  color: var(--fg);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
.mono, code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
.num { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; cursor: grab; }
#view.dragging { cursor: grabbing; }

/* ---- chrome -------------------------------------------------------------- */
.brand { position: fixed; top: 0; left: 0; padding: 18px 22px; pointer-events: none; z-index: 3; }
.brand .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.brand h1 { font-size: 19px; font-weight: 300; letter-spacing: 0.15em;
  text-transform: uppercase; margin: 0; }
.brand .sub { font-size: 12px; color: var(--muted); margin: 7px 0 0; max-width: 44ch; line-height: 1.4; }

.card {
  background: var(--panel);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.eyebrow-sm { font-size: 10px; font-weight: 600; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--dim); margin: 0; }

#right { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 336px;
  display: flex; flex-direction: column; align-items: stretch; gap: 10px;
  overflow: hidden; z-index: 4; }
#right.collapsed #controls, #right.collapsed #actions { display: none; }
#topbtns { display: flex; gap: 6px; justify-content: flex-end; flex: 0 0 auto; }
#controls { flex: 0 1 auto; min-height: 0; overflow: hidden auto;
  padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
#actions { flex: 0 0 auto; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px; }

#left { position: fixed; left: 12px; top: 128px; bottom: 12px; width: 388px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
  pointer-events: none; z-index: 4; }
#inspect { flex: 0 0 auto; max-height: 38vh; overflow: hidden auto; pointer-events: auto;
  padding: 12px 13px 13px; display: none; flex-direction: column; gap: 8px;
  animation: fade 0.2s ease; }
#inspect.on { display: flex; }
#readout { flex: 1 1 auto; min-height: 0; overflow: hidden auto; pointer-events: auto;
  padding: 14px 16px 15px; display: flex; flex-direction: column; gap: 12px; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

@media (max-width: 1180px) {
  html, body { overflow: auto; }
  #view { position: fixed; }
  #left, #right { position: static; width: auto; max-width: 460px; margin: 0 auto; }
  #left { padding: 62vh 12px 12px; }
  #right { padding: 12px; }
}

/* ---- buttons ------------------------------------------------------------- */
.btn { padding: 6px 12px; font-size: 12px; letter-spacing: 0.02em; border-radius: 6px;
  cursor: pointer; background: rgba(255,255,255,0.05); border: 1px solid var(--line-strong);
  color: var(--fg-2); transition: background .15s, border-color .15s, color .15s; }
.btn:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
.btn.primary:hover { background: #6ab8ff; }
.btn:disabled { opacity: 0.45; cursor: progress; }
.btn.icon { width: 28px; height: 28px; padding: 0; display: inline-flex;
  align-items: center; justify-content: center; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { padding: 6px 11px; font-size: 11px; letter-spacing: 0.02em; border-radius: 999px;
  cursor: pointer; background: rgba(255,255,255,0.05); border: 1px solid var(--line-strong);
  color: var(--muted); transition: background .15s, border-color .15s, color .15s; }
.chip:hover { color: var(--fg); }
.chip.on { background: rgba(77,166,255,0.16); border-color: rgba(77,166,255,0.5); color: var(--accent); }
.linkish { padding: 0; background: none; border: none; font-size: 10px; letter-spacing: 0.03em;
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px; color: var(--dim); }
.linkish:hover { color: var(--accent); }

/* ---- segmented tabs ------------------------------------------------------ */
.seg { display: flex; gap: 3px; padding: 3px; background: rgba(255,255,255,0.04);
  border: 1px solid var(--line); border-radius: 8px; }
.seg button { flex: 1; padding: 6px 0; font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
  border-radius: 6px; cursor: pointer; background: none; border: none; color: var(--muted);
  transition: background .15s, color .15s; }
.seg button.on { background: rgba(255,255,255,0.1); color: var(--fg); }

.ptabs { display: flex; gap: 4px; }
.ptabs button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 7px 0; font-size: 12px; font-weight: 500; border-radius: 6px; cursor: pointer;
  background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--muted);
  transition: background .15s, border-color .15s, color .15s; }
.ptabs button.on { background: rgba(255,255,255,0.09); color: var(--fg); }
.ptabs button.dark { opacity: 0.4; }
.ptabs .dot { width: 6px; height: 6px; border-radius: 999px; }

/* ---- sliders ------------------------------------------------------------- */
.sl { display: flex; flex-direction: column; gap: 5px; }
.sl .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sl .lab { font-size: 12px; color: var(--fg-2); }
.sl .sym { font-size: 10px; color: var(--dim); margin-left: 5px; }
.sl .val { font-size: 12px; color: var(--fg); }
.sl .track { height: 18px; display: flex; align-items: center; cursor: ew-resize; touch-action: none; }
.sl .rail { position: relative; flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 999px; }
.sl .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--accent); }
.sl .knob { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px;
  border-radius: 999px; background: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,0.55); }
.sl .help { font-size: 11px; line-height: 1.45; color: var(--muted); margin: 0 0 2px; display: none; }
.explain .help, .explain .grouphelp { display: block !important; }
.grouphelp { font-size: 11px; line-height: 1.45; color: var(--muted); margin: -4px 0 0; display: none; }
.kpill { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; padding: 1px 5px;
  border-radius: 999px; margin-left: 6px; color: var(--assume);
  border: 1px solid rgba(217,168,0,0.45); }

/* ---- readout ------------------------------------------------------------- */
.badge { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; border-radius: 999px;
  padding: 4px 10px; white-space: nowrap; }
.big { font-size: 44px; font-weight: 200; line-height: 0.9; letter-spacing: -0.02em; }
.bigrow { display: flex; align-items: flex-end; gap: 10px; }
.bigrow .unit { padding-bottom: 4px; }
.framepic { width: 100%; display: block; border-radius: 5px;
  border: 1px solid var(--line-strong); background: var(--stage); cursor: zoom-in; }
.rowline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px;
  border-top: 1px solid var(--line); }
.grid2 > div { padding: 9px 10px 0 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.grid2 .k { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.grid2 .v { font-size: 14px; }
.sect { border-top: 1px solid var(--line); padding-top: 11px; display: flex;
  flex-direction: column; gap: 7px; }
.shots { display: flex; gap: 5px; flex-wrap: wrap; }
.shots figure { flex: 1 1 30%; margin: 0; display: flex; flex-direction: column; gap: 3px; cursor: zoom-in; }
.shots canvas { width: 100%; display: block; border-radius: 4px;
  border: 1px solid var(--line-strong); background: var(--stage); }
.shots figcaption { font-size: 9px; letter-spacing: 0.08em; color: var(--dim); text-align: center; }
table.rec { width: 100%; border-collapse: collapse; font-size: 11px; }
table.rec th { text-align: left; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--dim); font-weight: 600; padding: 0 6px 4px 0; }
table.rec td { padding: 3px 6px 3px 0; vertical-align: baseline; }
table.rec td.r { text-align: right; }
pre.cfg { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px;
  line-height: 1.65; margin: 0; white-space: pre; overflow-x: auto; color: var(--fg-2);
  border: 1px solid var(--line-strong); border-radius: 6px; background: var(--stage); padding: 9px 11px; }
.note { font-size: 11px; line-height: 1.45; color: var(--muted); margin: 0; }
.note.tiny { font-size: 10px; color: var(--dim); }
.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden;
  border: 1px solid var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

/* ---- lightbox ------------------------------------------------------------ */
#lightbox { position: fixed; inset: 0; background: rgba(4,4,7,0.92); z-index: 20;
  display: none; align-items: center; justify-content: center; padding: 32px; cursor: zoom-out; }
#lightbox.on { display: flex; }
#lightbox canvas { max-width: 100%; max-height: 84vh; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--stage); }
#lightbox .cap { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
  font-size: 12px; color: var(--muted); }

#fatal { position: fixed; inset: 18% 12% auto; padding: 16px 18px; border-radius: 8px;
  border: 1px solid var(--bad); background: rgba(40,10,10,0.95); color: var(--bad);
  white-space: pre-wrap; font-size: 12.5px; display: none; z-index: 30; max-height: 60vh;
  overflow: auto; }
#fatal.on { display: block; }

#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 2; }
#boot p { font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); }
#boot.off { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="boot"><p>Building the room…</p></div>

<div class="brand">
  <p class="eyebrow">Science On a Sphere</p>
  <h1>Installation simulator</h1>
  <p class="sub">Every number is computed by the forward model. Recalibrate runs the inverse model
  on light this simulator photographed.</p>
</div>

<div id="right">
  <div id="topbtns"></div>
  <div id="controls" class="card"></div>
  <div id="actions" class="card"></div>
</div>

<div id="left">
  <div id="inspect" class="card"></div>
  <div id="readout" class="card"></div>
</div>

<div id="lightbox"><canvas id="lightbox-canvas"></canvas><div class="cap"></div></div>
<div id="fatal"></div>

<script type="module" src="./dist/web/web/main.js"></script>
</body>
</html>
