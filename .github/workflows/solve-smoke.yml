name: Solve smoke

# THE CHECKS CI NEVER RAN.
#
# `smoke:app` takes no flags in `ci.yml`, and three of its checks sit behind
# `if (opts.solve)`. So the most expensive check in the repository was the one
# nothing exercised, and two of those three were broken on `main` for as long as
# anyone had run them — found by hand, not by a build. The failure mode of a
# check that does not run is silence, which is the same argument `check:ci-parity`
# is built on.
#
# WHY NOT IN `ci.yml`: the run drives a real browser through two full bundle
# adjustments and takes 25-45 minutes on a runner with no GPU. Taxing every push
# and every pull request with that would buy a check nobody waits for and a
# habit of merging past it. Nightly catches rot within a day of it landing,
# which is the timescale that matters for checks whose job is to notice that
# something else broke.
#
# `workflow_dispatch` because the first question after a page change is "does the
# live calibration still work", and the answer should not require waiting for
# tomorrow.

on:
  schedule:
    # About 06:00 UTC daily, deliberately NOT on the hour.
    #
    # This line used to read "06:00 UTC daily, off the peak of the shared runner
    # pool" and set `0 6 * * *`. Both halves were wrong. What was observed on the
    # first two nights this schedule existed:
    #
    #   2026-09-13 06:00 slot — started 11:23:01Z, 5 h 23 m late. Passed.
    #   2026-09-14 06:00 slot — started 12:15:35Z, 6 h 15 m late. Passed.
    #
    # The second line first read "still no run at 12:02Z" and treated that as the
    # outcome. The run started at 12:15 — thirteen minutes after the check. That
    # is the same error this comment was written to correct: a snapshot reported
    # as a result. Twice, in the same file, is worth recording rather than
    # quietly fixing.
    #
    # So two firings, both LATE and both successful — not dropped. That is a
    # measurement, not a diagnosis: nobody here has established WHY, and GitHub
    # does not report it. What is
    # documented is that scheduled workflows are delayed under load and that the
    # start of every hour is the heaviest moment, which makes `0 6` the worst
    # available minute and `37` an ordinary one. The move is a hedge against the
    # documented cause, not a fix for a proven one, and the next few nights are
    # what say whether it helped.
    #
    # The delay has not cost anything so far: this job exists to catch rot within
    # a day of it landing, and a run that lands five or six hours late still does
    # that. Nothing here has yet shown a slot being LOST, only postponed, so the
    # move to `37` is about predictability rather than about rescuing a check that
    # was failing to run.
    - cron: '37 6 * * *'
  workflow_dispatch:

jobs:
  solve-smoke:
    runs-on: ubuntu-latest
    # Well clear of the observed 25-45 minutes: a container with no GPU has been
    # seen spending 32 s on a single redraw, and the point of this job is to tell
    # a slow machine from a broken page rather than to cut one off as the other.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci

      # The bundles first: the smoke serves the app it is about to drive. Mirrored
      # by `npm run ci:solve`, and `check:ci-parity` compares the two — a step
      # added here without a script to match it would be exactly the silence this
      # job exists to end.
      - name: Build the browser bundles
        run: |
          npm run build:web
          npm run build:app

      # Presses Recalibrate, which `npm run smoke:app` never does: a calibration
      # on the sphere, then one on a dropped model, then whether a view control
      # or a projector bump throws the recovered rig away.
      - name: Smoke the live calibration (sphere and model)
        run: npm run smoke:solve
